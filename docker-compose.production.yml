version: '3.8'

services:
  atomic-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: atomic-server-production
    restart: unless-stopped
    ports:
      - "8081:8080"
    volumes:
      - ./data:/atomic/data:rw
      - ./config:/atomic/config:rw
      - ./logs:/atomic/logs:rw
    environment:
      - ATOMIC_PORT=8080
      - ATOMIC_DATA_DIR=/atomic/data
      - ATOMIC_CONFIG_DIR=/atomic/config
      - ATOMIC_LOG_DIR=/atomic/logs
      - ATOMIC_LOG_LEVEL=info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/server/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - atomic-network
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID

  # Caddy reverse proxy for external access
  caddy:
    image: caddy:2.7-alpine
    container_name: atomic-server-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
    depends_on:
      atomic-server:
        condition: service_healthy
    networks:
      - atomic-network
    command: caddy run --config /etc/caddy/Caddyfile --adapter caddyfile

volumes:
  caddy_data:
    driver: local
  caddy_config:
    driver: local

networks:
  atomic-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16